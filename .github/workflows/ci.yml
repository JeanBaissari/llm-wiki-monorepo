name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run release manifest validation
        id: manifest
        run: |
          python3 scripts/release_manifest.py --json > /tmp/release-manifest-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/release-manifest-report.json

      - name: Run docs truth check
        id: docs
        run: |
          python3 scripts/docs_truth_check.py --json > /tmp/docs-truth-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/docs-truth-report.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-reports
          path: |
            /tmp/release-manifest-report.json
            /tmp/docs-truth-report.json

      - name: Fail on validation errors
        if: steps.manifest.outputs.exit_code != 0 || steps.docs.outputs.exit_code != 0
        run: |
          echo "Release validation failed"
          exit 1

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run provenance scan
        run: python3 scripts/provenance_scan.py
      - name: Upload provenance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-scan-report
          path: reports/provenance-scan-report.json

  typescript-workspaces:
    strategy:
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm dependencies
        run: npm install

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Typecheck all packages
        run: npm run typecheck --workspaces --if-present

      - name: Run TypeScript tests
        run: npm run test:ts

      - name: Zero-test guard
        run: python3 scripts/zero_test_guard.py --test-command "npm test" --packages graph-engine mcp-server audit-shared --allow-zero audit-shared

  python:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python scripts syntax
        run: |
          for f in skill/scripts/*.py; do
            python3 -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done

      - name: Install Python test dependencies
        run: pip install -e ".[dev,test]"

      - name: Check fixture freshness
        run: python3 -m pytest tests/test_fixtures_fresh.py -q

      - name: Run pytest with coverage
        run: python3 -m pytest tests/ -v --cov=src/llm_wiki --cov-report=term --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  # LWM_023: exercise the semantic layer's platform-sensitive paths (sqlite-vec
  # loadable extension + numpy KNN + hybrid fusion) on more than one OS. macOS is
  # included because its system Python often ships with extension-loading
  # disabled — the case our vec0→numpy→keyword fallback must handle. The eval
  # regression gate (tests/test_eval_regression.py) runs here too.
  semantic:
    name: Semantic layer (optional extras)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps + platform-sensitive semantic deps
        run: |
          pip install -e ".[dev,test]"
          pip install numpy "sqlite-vec>=0.1.1"
      - name: Run full suite (with vector paths active)
        run: python3 -m pytest tests/ -q -m "not slow"

  # LWM_023: prove the base install stays lexical-only — no numpy / model2vec /
  # sqlite-vec pulled in, and the new semantic/eval modules import safely and are
  # inert without the extra.
  base-install-purity:
    name: Base install has no semantic deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras)
        run: pip install -e .
      - name: Assert base install is lexical-only and CLI works
        run: |
          python3 -c "import llm_wiki.semantic as s; assert s.is_semantic_available() is False, 'base install must not carry semantic deps'; assert s.get_embedder() is None"
          python3 -c "import llm_wiki.eval, llm_wiki.search.query, llm_wiki.semantic.embed  # import-safe without the extra"
          llm-wiki --version

  schema-cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install Python deps
        run: pip install -e ".[dev,test]"
      - name: Install TypeScript deps
        run: cd audit-shared && npm install && npm run build
      - name: Cross-language schema validation
        run: python3 -m pytest tests/test_schema_audit.py -q -k "CrossLanguage"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install npm dependencies
        run: npm install

      - name: TypeScript build graph-engine
        run: cd graph-engine && npx tsc

      - name: TypeScript build mcp-server
        run: cd mcp-server && npx tsc

      - name: Build audit-shared
        run: cd audit-shared && npm run build

      - name: Install Python test dependencies
        run: pip install -e ".[dev,test]"

      - name: Scaffold test wiki
        run: python3 skill/scripts/scaffold.py /tmp/ci-test "CI Test" --template codebase --force

      - name: Lint test wiki
        run: python3 skill/scripts/lint_wiki.py /tmp/ci-test

      - name: Graph-engine build test
        run: node graph-engine/dist/index.js --wiki /tmp/ci-test --action build

      - name: Graph-engine insights test
        run: node graph-engine/dist/index.js --wiki /tmp/ci-test --action insights

      - name: Graph insights Python test
        run: python3 skill/scripts/graph_insights.py /tmp/ci-test --format markdown

  certify:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install npm dependencies
        run: npm install

      - name: Build TypeScript packages
        run: npm run build --workspaces --if-present

      - name: Install Python test dependencies
        run: pip install -e ".[dev,test]"

      - name: Regenerate fixtures
        run: python3 skill/scripts/regenerate_fixtures.py

      - name: Run release certification
        run: python3 scripts/release_certify.py

      - name: Upload certification report
        uses: actions/upload-artifact@v4
        with:
          name: release-certification-report
          path: reports/release-certification.json
