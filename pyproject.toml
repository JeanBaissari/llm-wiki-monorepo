[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "baissarienterprises-llm-wiki"
version = "0.2.1"
description = "Knowledge base operating system — AI agents compile raw sources into persistent, cross-linked Markdown wikis with concurrency control, multi-provider LLM integration, FTS5 search, and community detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "wiki", "knowledge-base", "llm", "ai-agents",
    "mcp", "knowledge-graph", "markdown", "research-tool",
    "second-brain", "hermes-agent", "opencode",
    "concurrency", "community-detection", "louvain",
    "fts5", "search", "structured-output",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.55",
    "anthropic>=0.39",
    "litellm>=1.90",
    "instructor>=1.15",
    "tenacity>=8.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "portalocker>=2.8",
]

[project.urls]
Homepage = "https://github.com/JeanBaissari/llm-wiki-monorepo"
Repository = "https://github.com/JeanBaissari/llm-wiki-monorepo"
Documentation = "https://github.com/JeanBaissari/llm-wiki-monorepo/blob/main/QUICKGUIDE.md"
Changelog = "https://github.com/JeanBaissari/llm-wiki-monorepo/blob/main/CHANGELOG.md"
Issues = "https://github.com/JeanBaissari/llm-wiki-monorepo/issues"

[project.scripts]
llm-wiki = "llm_wiki.cli:main"
llm-wiki-scaffold = "llm_wiki.scaffold:main"
llm-wiki-ingest = "llm_wiki.ingest:main"
llm-wiki-lint = "llm_wiki.lint_wiki:main"
llm-wiki-insights = "llm_wiki.graph_insights:main"
llm-wiki-link-suggest = "llm_wiki.link_suggest:main"
llm-wiki-backup = "llm_wiki.backup:main"
llm-wiki-benchmark = "llm_wiki.benchmark:main"
llm-wiki-deep-research = "llm_wiki.deep_research:main"
llm-wiki-audit = "llm_wiki.audit_review:main"
llm-wiki-discover = "llm_wiki.discover:main"
llm-wiki-index = "llm_wiki.index_wiki:main"
llm-wiki-health = "llm_wiki.health_check:main"
llm-wiki-serve = "llm_wiki.serve:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "vcrpy>=6.0"]
graph = ["networkx>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: slow benchmark tests"]
addopts = "-m 'not slow'"

[tool.setuptools.package-data]
llm_wiki = ["py.typed"]
