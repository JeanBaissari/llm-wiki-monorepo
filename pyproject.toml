[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "baissarienterprises-llm-wiki"
version = "0.4.0"
description = "Agent-native knowledge compiler — 18 CLI commands, 14 MCP tools, 10 domain packages. AI agents turn raw documents into persistent, cross-linked Markdown wikis with modular architecture, concurrency control, multi-provider LLM support, FTS5 search, claims tracking, and Louvain community detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "wiki", "knowledge-base", "llm", "ai-agents",
    "mcp", "knowledge-graph", "markdown", "research-tool",
    "second-brain", "agent-native", "opencode",
    "concurrency", "community-detection", "louvain",
    "fts5", "search", "structured-output",
    "modular", "monorepo", "epistemic",
    "claims", "operation-context", "sidecar", "observability",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.55",
    "anthropic>=0.39",
    "litellm>=1.90",
    "instructor>=1.15",
    "tenacity>=8.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "portalocker>=2.8",
]

[project.urls]
Homepage = "https://github.com/JeanBaissari/llm-wiki-monorepo"
Repository = "https://github.com/JeanBaissari/llm-wiki-monorepo"
Documentation = "https://github.com/JeanBaissari/llm-wiki-monorepo/blob/main/docs/getting-started/quickstart.md"
Changelog = "https://github.com/JeanBaissari/llm-wiki-monorepo/blob/main/docs/release/changelog.md"
Issues = "https://github.com/JeanBaissari/llm-wiki-monorepo/issues"

[project.scripts]
llm-wiki = "llm_wiki.cli:main"
llm-wiki-scaffold = "llm_wiki.wiki.scaffold:main"
llm-wiki-ingest = "llm_wiki.ingest.pipeline:main"
llm-wiki-lint = "llm_wiki.quality.lint:main"
llm-wiki-insights = "llm_wiki.graph.insights:main"
llm-wiki-link-suggest = "llm_wiki.graph.suggest:main"
llm-wiki-backup = "llm_wiki.wiki.backup:main"
llm-wiki-benchmark = "llm_wiki.ops.benchmark:main"
llm-wiki-deep-research = "llm_wiki.research.deep_research:main"
llm-wiki-audit = "llm_wiki.quality.audit:main"
llm-wiki-discover = "llm_wiki.core.layout:main"
llm-wiki-index = "llm_wiki.search.index:main"
llm-wiki-health = "llm_wiki.ops.health:main"
llm-wiki-serve = "llm_wiki.ops.serve:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "vcrpy>=6.0"]
graph = ["networkx>=3.0"]
# v0.4.0 Semantic Core — optional extras. Base install stays lexical/keyword-only
# and behaves identically without these (LWM_013 invariant #3). model2vec is
# numpy-only (no torch); sqlite-vec is a loadable extension with a numpy KNN
# fallback (LWM_017/ADR-0016) so search degrades to keyword when it can't load.
semantic = ["model2vec>=0.3", "numpy>=1.24", "sqlite-vec>=0.1.1"]
eval = ["deepeval>=1.0"]
# v0.5.0 Graph Precision — optional extras. Base install stays lexical/keyword-only
# with pure-Python fallbacks (v0.5.0 invariant #3). entity-resolution (Splink) is a
# precision-upgrade backend for LWM_025; ner (GLiNER, Apache-2.0, CPU/ONNX/INT8) is
# an optional entity extractor for LWM_026 — both degrade to the pure-Python path.
entity-resolution = ["splink>=4.0"]
ner = ["gliner>=0.2.13", "onnxruntime>=1.17"]
# Leiden community detection (LWM_027/ADR-0025): graspologic is MIT (chosen over
# GPLv3 leidenalg). Optional; the community engine falls back to Louvain without it.
leiden = ["graspologic>=3.4", "networkx>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: slow benchmark tests"]
addopts = "-m 'not slow'"

[tool.setuptools.package-data]
llm_wiki = ["py.typed"]
